name: Check site
description: Install dependencies, validate source, build, and audit the static site.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Verify native TypeScript compiler
      shell: bash
      run: pnpm exec tsc --version

    - name: Lint TypeScript and CSS and check formatting
      shell: bash
      run: pnpm lint

    - name: Run tests, type checking, and production build
      shell: bash
      run: pnpm test && pnpm build

    - name: Check mobile and desktop Lighthouse scores for every content page
      shell: bash
      run: pnpm audit:performance

    - name: Save Lighthouse reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lighthouse-reports
        path: lighthouse-reports/
        if-no-files-found: ignore
        retention-days: 7
