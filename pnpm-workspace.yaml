minimumReleaseAgeExclude:
  - eslint@10.10.0
  - "@html-eslint/core@0.66.0"
  - "@html-eslint/eslint-plugin@0.66.0"
  - "@html-eslint/parser@0.66.0"
  - "@html-eslint/template-parser@0.66.0"
  - "@html-eslint/template-syntax-parser@0.66.0"
  - "@html-eslint/types@0.66.0"

# Keep dependency layout consistent between local development and CI.
enableGlobalVirtualStore: false

# Patched parser for GHSA-82x6-q7mm-w9cf and GHSA-v5mp-jgw5-2x6j.
overrides:
  remark-mdx-frontmatter>toml: ^4.2.0
